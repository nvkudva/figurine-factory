repos:
  - repo: local
    hooks:
      - id: no-photos
        name: block photos and subject media from git
        entry: python scripts/check_no_photos.py
        language: system
        pass_filenames: true
        always_run: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
